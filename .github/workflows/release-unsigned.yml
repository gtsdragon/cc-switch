name: Unsigned Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        default: v3.19.1

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater signing for this build
        shell: bash
        run: |
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/unsigned-release.conf.json

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg --config src-tauri/unsigned-release.conf.json

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --bundles msi --config src-tauri/unsigned-release.conf.json

      - name: Collect macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          dmg=$(find src-tauri/target -type f -name '*.dmg' | head -1)
          test -n "$dmg"
          cp "$dmg" "release-assets/CC-Switch-${RELEASE_TAG}-macOS-unsigned.dmg"

      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $msi = Get-ChildItem -Path src-tauri/target -Recurse -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) { throw 'No Windows MSI was produced' }
          Copy-Item $msi.FullName "release-assets/CC-Switch-$env:RELEASE_TAG-Windows-x64-unsigned.msi"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish unsigned release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: CC Switch 隐私过滤版 ${{ inputs.tag }}
          prerelease: true
          body: |
            This fork build follows upstream and includes local privacy filtering.

            Packages in this release are unsigned. macOS may require `xattr -cr` and Windows may show a SmartScreen warning on first launch.

            These packages are for manual installation. They do not provide signed Tauri updater artifacts.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
